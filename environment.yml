# Conda environment for Ekonomski semafori. Create with: conda env create -f environment.yml
# Then install the package in editable mode: python -m pip install -e .
name: semafori
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - blas=*=openblas   # the MKL variant made every numpy.linalg call crash (DLL delay-load fault) on Windows
  - pandas=3.0.*
  - numpy=2.*
  - scipy
  - statsmodels=0.15.*
  - pyyaml
  - openpyxl
  - eurostat
  - ecbdata
  # X-13ARIMA-SEATS is NOT taken from conda-forge: its Windows build (x13as 1.1.61) exits with a
  # stack overflow on series of realistic length. Set X13PATH instead; see README.
  - pytest
  - pip
