[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekonomski-semafori"
version = "0.1.0"
description = "Business cycle clocks for Croatia and 20 euro area countries"
requires-python = ">=3.12"
# Runtime dependencies are managed by environment.yml (conda-forge). Kept empty here
# so `pip install -e .` never pulls pip builds over the conda ones.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls Eurostat or the ECB over the network"]
addopts = "-m \"not live\""
